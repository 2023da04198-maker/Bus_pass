<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Details</title>

<script>
if (sessionStorage.getItem("authenticated") !== "true") {
    window.location.replace("index.html");
}
</script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 350px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.15);
    text-align: center;
}

input, select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #aaa;
    box-sizing: border-box;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: none;
    background: #0090d4;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>Enter Your Details</h2>

    <input type="text" id="userName" placeholder="Enter Name">
    <input type="text" id="empId" placeholder="Enter Employee ID">

    <select id="shift">
        <option value="">Select Shift</option>
        <option value="08:30-18:00">08:30 - 18:00</option>
        <option value="10:15-19:50">10:15 - 19:50</option>
        <option value="12:30-22:00">12:30 - 22:00</option>
    </select>

    <button id="submitBtn" onclick="goNext()">Continue</button>
</div>

<script>
function goNext() {

    const name = document.getElementById("userName").value.trim();
    const empId = document.getElementById("empId").value.trim();
    const shift = document.getElementById("shift").value;

    if (!name || !empId || !shift) {
        alert("Please fill all fields");
        return;
    }

    document.getElementById("submitBtn").disabled = true;
    document.getElementById("submitBtn").innerText = "Submitting...";

    // Save locally
    sessionStorage.setItem("name", name);
    sessionStorage.setItem("empId", empId);
    sessionStorage.setItem("shift", shift);

    // Send to Google Sheet in background
    fetch(
        "https://script.google.com/macros/s/AKfycbwHch0Z6ms3e2xGJmQD1xIeGqkDo4oEhR4BrJRGtEujMyeCPNOM0BCTJcDdCGpefIpweA/exec",
        {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                empId: empId,
                shift: shift,
                submittedAt: new Date().toLocaleString()
            })
        }
    ).catch(err => console.error(err));

    // Redirect immediately
    window.location.href = "rp.html";
}
</script>

</body>
</html>
